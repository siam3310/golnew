name: Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle Wrapper
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-output/free-and-live-v1.0.0.apk
            echo "Copied $APK_FILE to release-output/free-and-live-v1.0.0.apk"
          else
            echo "Error: APK not found!" && exit 1
          fi

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "free&live ${{ steps.vars.outputs.tag }}"
          body: |
            ### 🚀 free&live ${{ steps.vars.outputs.tag }} Release

            - **Aspect Ratio options**: Fit (RESIZE_MODE_FIT), Zoom (RESIZE_MODE_ZOOM), Fill (RESIZE_MODE_FILL)
            - **Live matches & events**: Real-time sports streaming with low latency
            - **Settings menu**: Easily configure stream preferences and cache
            - **Clean layout**: Streamlined match titles with centered vs text

            #### 📥 Download
            Download **free-and-live-v1.0.0.apk** below to install on your Android phone, tablet, or Android TV.
          files: release-output/free-and-live-v1.0.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
