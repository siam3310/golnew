name: Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-output/free-and-live-v1.0.0.apk
            echo "Copied $APK_FILE to release-output/free-and-live-v1.0.0.apk"
          else
            echo "Error: APK not found!" && exit 1
          fi

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "free&live ${{ steps.vars.outputs.tag }}"
          body: |
            ### 🚀 free&live ${{ steps.vars.outputs.tag }} Release

            - **Aspect Ratio options**: Fit (RESIZE_MODE_FIT), Zoom (RESIZE_MODE_ZOOM), Fill (RESIZE_MODE_FILL)
            - **Video scaling fix**: Native AspectRatioFrameLayout prevents video expansion during live streams
            - **Live matches & events**: Real-time sports streaming with low latency
            - **Lightweight settings**: Clean, uncluttered preferences dialog
            - **Android TV & Mobile**: Optimized layouts for both handheld and TV remote controls

            #### 📥 Download
            Download **free-and-live-v1.0.0.apk** below to install on your Android phone, tablet, or Android TV.
          files: release-output/free-and-live-v1.0.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
