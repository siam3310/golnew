name: Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/free-and-live-v1.0.0.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "free&live v1.0.0"
          body: |
            ### 🚀 free&live - First Version Release (v1.0.0)

            - **Ultra-fast, zero-latency streaming engine**: Powered by AndroidX Media3 (ExoPlayer).
            - **Hardware acceleration**: Direct MediaCodec decoding with zero black-screen lag.
            - **CDN anti-blocking**: Chrome User-Agent and automatic Origin/Referer spoofing.
            - **Aspect Ratio options**:
              - `Fit` (RESIZE_MODE_FIT)
              - `Zoom` (RESIZE_MODE_ZOOM)
              - `Fill` (RESIZE_MODE_FILL)
            - **Live sports**: Live cricket and football matches with multi-server failover.
            - **Clean UI**: Centered match info, streamlined "vs", and dedicated Settings.

            Download **free-and-live-v1.0.0.apk** below to install on your Android device!
          files: release-output/free-and-live-v1.0.0.apk
          draft: false
          prerelease: false
