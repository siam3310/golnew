name: Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Build Environment (Keystore & Config)
        run: |
          # Restore debug.keystore if base64 encoded file exists
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Ensure debug.keystore exists with matching credentials for signing
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env exists for the secrets gradle plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          touch .env

          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK with Gradle (R8 Minified & Resource Shrunk)
        env:
          GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
        run: ./gradlew clean :app:assembleRelease --stacktrace

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare and Sign Release APK
        run: |
          mkdir -p release-output
          TAG="${{ steps.vars.outputs.tag }}"

          # Locate Android build-tools for zipalign and apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

          UNSIGNED_APK=$(find app/build/outputs/apk -name "*unsigned*.apk" -type f | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            echo "Found unsigned release APK: $UNSIGNED_APK"
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "release-output/aligned.apk"
            "$BUILD_TOOLS_DIR/apksigner" sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out "release-output/FakeOTT-${TAG}.apk" "release-output/aligned.apk"
            rm -f "release-output/aligned.apk"
            echo "Successfully signed release APK with apksigner."
          else
            APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
            if [ -z "$APK_FILE" ]; then
              APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
            fi
            if [ -n "$APK_FILE" ]; then
              cp "$APK_FILE" "release-output/FakeOTT-${TAG}.apk"
            else
              echo "Error: No APK found in app/build/outputs/apk!" && exit 1
            fi
          fi

          echo "Final APK details:"
          ls -lh release-output/*.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "FakeOTT ${{ steps.vars.outputs.tag }}"
          body: |
            ### 🍿 FakeOTT ~ yeah it's fake! ${{ steps.vars.outputs.tag }} Release

            - **Matches & Sports Streaming**: Live match schedules from fakeottadmin API with instant playback
            - **Movie Streaming Page**: Integrated streaming movies & series with quality selector (1080p, 720p, 480p)
            - **Bottom Navigation**: Seamless tab navigation between Sports and Movies
            - **Remember Aspect Ratio**: Remembers your preferred aspect ratio (Fit, Zoom, Fill)
            - **Ultra-lightweight APK**: Highly optimized under 10MB!
          files: release-output/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
